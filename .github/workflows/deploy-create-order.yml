name: Deploy create-order
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/create-order/**'
      - '.github/workflows/deploy-create-order.yml'
permissions:
  contents: read
concurrency:
  group: deploy-create-order-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: giswmwyidnqehflvaini
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate deployment credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Configure o segredo SUPABASE_ACCESS_TOKEN antes de executar este workflow."
            exit 1
          fi
      - name: Deploy create-order function
        run: supabase functions deploy create-order --project-ref "$PROJECT_ID" --no-verify-jwt
